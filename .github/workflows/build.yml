name: Build SDK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test release recovery and identity checks
        run: node --test scripts/tests/release-sdk.test.mjs

      - name: Build package
        run: npm run build

      - name: Check packed bundle behaviour
        run: node scripts/check-bundle.mjs

      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail

          npm pack --dry-run --json > npm-pack-dry-run.json

          node <<'NODE'
          const fs = require("node:fs");
          const pack = JSON.parse(fs.readFileSync("npm-pack-dry-run.json", "utf8"))[0];
          const files = new Set(pack.files.map((file) => file.path));
          const required = [
            "index.cjs.js",
            "index.esm.js",
            "index.cjs.d.ts",
            "index.esm.d.ts",
            "target/idl/glam_protocol.json",
            "target/types/glam_protocol.ts",
          ];

          for (const file of required) {
            if (!files.has(file)) {
              throw new Error(`Missing expected package file: ${file}`);
            }
          }

          console.log(
            JSON.stringify(
              {
                filename: pack.filename,
                files: pack.files.length,
                unpackedSize: pack.unpackedSize,
              },
              null,
              2,
            ),
          );
          NODE

      - name: Smoke test package entrypoint
        run: |
          node -e "const sdk = require('./index.cjs.js'); if (typeof sdk.getGlamProtocolProgramId !== 'function') process.exit(1);"

      - name: Upload pack manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-pack-dry-run
          path: npm-pack-dry-run.json

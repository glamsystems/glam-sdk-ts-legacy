# pnpm settings of this example. pnpm reads only the nearest
# pnpm-workspace.yaml.

# Supply-chain release cooldown, in minutes: pnpm refuses a release younger than
# seven days. Exclusions are registered in release-age-exceptions.csv at the
# repository root.
minimumReleaseAge: 10080
saveExact: true

# No dependency build script runs here, and none is approved. The pinned pnpm
# fails an install on a build script nobody approved, and on the record of one
# that an earlier install left in node_modules. strictDepBuilds turns that
# failure off, and ignoreScripts keeps pnpm from writing a placeholder for
# each such package into this file. `pnpm run` does not install first.
ignoreScripts: true
strictDepBuilds: false
verifyDepsBeforeRun: false

# Forced dependency versions.
overrides:
  "bigint-buffer@1.1.5": "npm:@exodus/bigint-buffer@1.1.5-exodus.1"
  "@solana/web3.js": "1.99.0"
  "bn.js@>=5.0.0 <5.2.5": "5.2.5"
  "diff@>=4.0.0 <4.0.4": "4.0.4"
  "jayson>ws@>=7.0.0 <7.5.11": "7.5.11"
  "rpc-websockets>ws@>=8.0.0 <8.21.0": "8.21.0"
  "jayson@>=4.0.0 <5.0.0": "5.0.0"
  "toml@>=3.0.0 <5.0.1": "5.0.1"
  "uuid@>=8.0.0 <11.1.1": "11.1.1"
  "zod@>=4.0.0 <4.6.7": "4.6.7"

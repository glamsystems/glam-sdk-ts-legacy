# pnpm settings of this example. pnpm reads only the nearest
# pnpm-workspace.yaml.

# Supply-chain release cooldown, in minutes: pnpm refuses a release younger than
# seven days. Exclusions are registered in release-age-exceptions.csv at the
# repository root.
minimumReleaseAge: 10080
saveExact: true

# Forced dependency versions.
overrides:
  "bigint-buffer@1.1.5": "npm:@exodus/bigint-buffer@1.1.5-exodus.1"
  "@solana/web3.js": "1.99.0"
  "bn.js@>=5.0.0 <5.2.5": "5.2.5"
  "body-parser@>=1.0.0 <1.20.9": "1.20.9"
  "diff@>=4.0.0 <4.0.4": "4.0.4"
  "path-to-regexp@>=0.1.0 <0.1.13": "0.1.13"
  "qs@>=6.0.0 <6.16.1": "6.16.1"
  "jayson>ws@>=7.0.0 <7.5.11": "7.5.11"
  "rpc-websockets>ws@>=8.0.0 <8.21.0": "8.21.0"
  "jayson@>=4.0.0 <5.0.0": "5.0.0"
  "toml@>=3.0.0 <5.0.1": "5.0.1"
  "uuid@>=8.0.0 <11.1.1": "11.1.1"
  "proxy-addr@>=1.1.0 <2.0.8": "2.0.8"
